<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — InherentCraft</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            text-align: center;
            padding: 25px 0;
            font-size: 30px;
            font-weight: bold;
        }

        .settings {
            padding: 20px;
        }

        .setting-button {
            width: 100%;
            padding: 18px;
            background: #151515;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            text-align: left;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .setting-button:active {
            background: #252525;
        }
    </style>
</head>

<body>

    <div class="header">
        InherentCraft
    </div>

    <div class="settings">

        <button
            class="setting-button"
            onclick="location.href='tema.html'">
            🎨 Темы
        </button>

        <button
            class="setting-button"
            onclick="location.href='project.html'">
            📤 Как выложить проект?
        </button>

    </div>

</body>
</html>
