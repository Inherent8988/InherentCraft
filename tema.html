<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Темы — InherentCraft</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            text-align: center;
            padding: 25px 0;
            font-size: 30px;
            font-weight: bold;
        }

        .themes {
            padding: 20px;
        }

        .theme {
            background: #151515;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
        }

        .theme:active {
            background: #252525;
        }
    </style>
</head>

<body>

    <div class="header">
        InherentCraft
    </div>

    <div class="themes">

        <div class="theme" onclick="setTheme('standard')">
            Standart
        </div>

        <div class="theme" onclick="setTheme('mohito')">
            MohitoFone
        </div>

    </div>

    <script>
        function setTheme(theme) {

            // Сохраняем выбранную тему
            localStorage.setItem("inherentcraftTheme", theme);

            // Возвращаемся на главную
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
